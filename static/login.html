<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion — Convertisseur de la chorale</title><style>body{font:17px/1.5 system-ui;background:#f6f5ef;color:#183e36;margin:0;padding:24px}main{max-width:420px;margin:8vh auto;background:white;padding:32px;border:1px solid #d9ded5;border-radius:16px}h1{font:32px Georgia}label{display:block;margin:20px 0}input,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #a9b8b0;border-radius:7px}button{background:#183e36;color:white;cursor:pointer}#error{color:#8b3025}small{display:block;margin-top:20px}</style><main><h1>Votre convertisseur privé</h1><p>Connectez-vous avec votre compte de conversion.</p><form id="login"><label>Nom d’utilisateur<input name="username" autocomplete="username" required autofocus></label><label>Mot de passe<input name="password" type="password" autocomplete="current-password" required></label><button>Se connecter</button><p id="error" role="alert"></p></form><small>Utilisez vos identifiants du convertisseur. Si votre compte n’est pas encore activé, ouvrez le lien reçu par courriel.</small></main><script>document.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget,button=form.querySelector('button'),error=document.querySelector('#error');button.disabled=true;error.textContent='';try{const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.elements.username.value,password:form.elements.password.value})});const data=await r.json();if(!r.ok)throw Error(data.error||'Connexion impossible.');location.reload();}catch(err){error.textContent=err.message;button.disabled=false;}});</script></html>
